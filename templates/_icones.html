{# Ícones em SVG (traço), usados via: {% from "_icones.html" import icone %} #}

{%- elif nome == "documento" %}<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>
{%- elif nome == "mensagem" %}<path d="M4 5h16v11H8l-4 4z"/>

{%- elif nome == "menu" %}<path d="M4 7h16M4 12h16M4 17h16"/>
{%- elif nome == "voltar" %}<path d="M15 6l-6 6 6 6"/>

</svg>
