{% extends "_layout.html" %}
{% block titulo %}{{ titulo }}{% endblock %}

{% block conteudo %}
<section class="cartao erro">
  <span class="erro-codigo">{{ codigo }}</span>
  <h1>{{ titulo }}</h1>
  <p>{{ mensagem }}</p>
  <div class="acoes">
    <a class="botao" href="{{ url_for('publico.inicio') }}">Voltar ao início</a>
    {% if current_user.is_authenticated %}
    <a class="botao botao-sec" href="{{ url_for('dashboards.listar') }}">Meus dashboards</a>
    {% endif %}
  </div>
</section>
{% endblock %}
