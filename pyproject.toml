[project]
name = "portal-cpa"
version = "0.1.0"
description = "Portal web da Comissão Própria de Avaliação (CPA) — Faculdade Impacta"
requires-python = ">=3.12"
# Mantenha igual ao requirements.txt (a Vercel pode instalar por qualquer um dos dois).
dependencies = [
    "Flask>=3.1",
    "Flask-Login>=0.6.3",
    "Flask-WTF>=1.2",
    "Flask-SQLAlchemy>=3.1",
    "SQLAlchemy>=2.0.36",
    "psycopg[binary]>=3.2.10",
    "supabase>=2.18",
    "python-dotenv>=1.0",
]

[tool.uv]
# App, não biblioteca: instalar só as dependências, sem empacotar o projeto.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# A pasta supabase/ (migrations) não é um pacote Python; o "supabase" é a biblioteca.
known-third-party = ["supabase"]
